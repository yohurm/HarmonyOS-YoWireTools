<text x="62" y="392.0" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">结果区</text>
<text x="62" y="410.0" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">成功、失败或缺少权限，写在结果区</text>
<text x="52" y="470" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">失败和无权限不新开导航。</text>
<rect x="500" y="88" width="420" height="440" rx="12" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
