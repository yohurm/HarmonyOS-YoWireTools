<text x="532" y="364" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">半模态：命令</text>
<text x="532" y="392" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">搜索、短列表、一个执行按钮</text>
<text x="532" y="416" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">关闭后回到原页</text>
<text x="532" y="456" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">不在半模态上再叠半模态。</text>
