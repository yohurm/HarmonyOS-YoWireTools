<text x="512" y="106" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">方案 B · 半模态</text>
<rect x="516" y="140" width="388" height="180" rx="6" fill="#FAFAF8" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="526" y="222.0" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">背后仍是当前页</text>
<text x="526" y="240.0" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">工作台或终端，不被第二套导航替换</text>
