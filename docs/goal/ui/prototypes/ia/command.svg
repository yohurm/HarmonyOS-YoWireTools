<text x="64" y="326" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">所选命令只有一个主按钮</text>
<text x="428" y="326" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="end" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif"></text>
