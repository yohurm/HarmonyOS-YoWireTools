<text x="24" y="480" font-size="14" font-weight="400" fill="#5C5C5C" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">BLE 从蓝牙入口进入 GATT，再进 BLE 串口。不回到第二套底部导航。</text>
<rect x="24" y="520" width="912" height="160" rx="8" fill="#FFF6E8" stroke="#8A4B08" stroke-width="1.5"/>
<text x="40" y="548" font-size="15" font-weight="700" fill="#8A4B08" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">本图只锁定页面归属。</text>
<text x="40" y="576" font-size="14" font-weight="400" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">未锁定：工作台用列表还是宫格；命令面板用整页还是半模态；宽屏栏宽用 40%、240vp 还是 4:6。</text>
<text x="40" y="604" font-size="14" font-weight="400" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">未锁定：标题栏、列表密度、色彩。那些要等工具库截图、更多官方页面样例和高星开源之后再画。</text>
<text x="40" y="640" font-size="14" font-weight="400" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">空 / 错 / 无权限是列表页内容区的状态，不是新的导航目的地。</text>
