<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
<rect width="100%" height="100%" fill="#F4F4F2"/>
<rect x="0" y="0" width="960" height="64" rx="0" fill="#E7E7E4" stroke="none" stroke-width="0"/>
<text x="24" y="24" font-size="13" font-weight="700" fill="#8A4B08" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">信息架构草图 · 非高保真</text>
<text x="24" y="46" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">半模态与终端</text>
<text x="936" y="46" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="end" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">结构，不是视觉定稿</text>
<rect x="36" y="88" width="420" height="440" rx="12" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
<line x1="48" y1="124" x2="444" y2="124" stroke="#8A8A8A" stroke-width="1"/>
<text x="48" y="106" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">半模态盖在列表上</text>
<rect x="52" y="140" width="388" height="120" rx="6" fill="#FAFAF8" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="62" y="192.0" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">列表仍在后面</text>
<text x="62" y="210.0" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">变暗，不能同时再开第二层</text>
<rect x="52" y="276" width="388" height="220" rx="10" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="68" y="304" font-size="14" font-weight="700" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">标题 + 关闭</text>
<text x="68" y="332" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">配对：说明系统会弹出配对，应用不替代 PIN</text>
<text x="68" y="360" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">连接：UUID 标签、勾选、超时、一个连接按钮</text>
<text x="68" y="400" font-size="13" font-weight="400" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">主按钮一个。取消是次操作。</text>
<text x="68" y="432" font-size="13" font-weight="400" fill="#5C5C5C" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">配对完成并关闭后，才进入连接。</text>
<rect x="500" y="88" width="420" height="440" rx="12" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
<line x1="512" y1="124" x2="908" y2="124" stroke="#8A8A8A" stroke-width="1"/>
<text x="512" y="106" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">终端页</text>
<rect x="516" y="140" width="388" height="36" rx="6" fill="#FAFAF8" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="526" y="158.0" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">标题栏：返回 + 会话名</text>
<rect x="516" y="188" width="388" height="48" rx="6" fill="#FAFAF8" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="526" y="204.0" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">连接摘要</text>
<text x="526" y="222.0" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">目标、状态、字节数</text>
<rect x="516" y="248" width="388" height="160" rx="6" fill="#FAFAF8" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="526" y="320.0" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">接收区</text>
<text x="526" y="338.0" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">文本 / HEX / 混合。空、发送失败写在这里。</text>
<rect x="516" y="420" width="388" height="72" rx="6" fill="#FAFAF8" stroke="#1A1A1A" stroke-width="1.5"/>
<text x="526" y="448.0" font-size="13" font-weight="700" fill="#1A1A1A" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">发送区</text>
<text x="526" y="466.0" font-size="12" font-weight="400" fill="#5C5C5C" text-anchor="start" dominant-baseline="central" font-family="WenQuanYi Micro Hei, Droid Sans Fallback, sans-serif">标签 + 输入 + 一个发送按钮</text>
</svg>
