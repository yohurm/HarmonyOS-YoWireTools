<text x="16" y="388" font-family="WenQuanYi Micro Hei, HarmonyOS Sans, sans-serif" font-size="12" font-weight="400" fill="#5C6B7A" text-anchor="start">API 26 及以上才允许无过滤，并且必须单独确认功耗和噪声。</text>
