<text x="318" y="24" font-family="WenQuanYi Micro Hei, HarmonyOS Sans, sans-serif" font-size="11" font-weight="500" fill="#5C6B7A" text-anchor="start">5G</text>
<rect x="342" y="14" width="22" height="10" rx="2" fill="none" stroke="#5C6B7A" stroke-width="1"/>
