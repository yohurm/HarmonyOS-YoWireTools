<rect x="0" y="92" width="390" height="36" rx="0" fill="#E8F0FE"/>
<text x="16" y="115" font-family="WenQuanYi Micro Hei, HarmonyOS Sans, sans-serif" font-size="12" font-weight="500" fill="#0A59F7" text-anchor="start">端口已就绪  ·  用户要求加密</text>
