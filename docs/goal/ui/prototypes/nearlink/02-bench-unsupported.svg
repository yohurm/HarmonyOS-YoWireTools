<text x="36" y="478" font-family="WenQuanYi Micro Hei, HarmonyOS Sans, sans-serif" font-size="12" font-weight="400" fill="#5C6B7A" text-anchor="start">不支持时不展示可点的发现列表。</text>
<text x="354" y="450" font-family="WenQuanYi Micro Hei, HarmonyOS Sans, sans-serif" font-size="14" font-weight="600" fill="#8A94A0" text-anchor="end">预留</text>
