<rect x="0" y="36" width="390" height="56" rx="0" fill="#FFFFFF"/>
<text x="20" y="70" font-family="WenQuanYi Micro Hei, HarmonyOS Sans, sans-serif" font-size="20" font-weight="600" fill="#182431" text-anchor="start">星闪</text>
<line x1="0" y1="92" x2="390" y2="92" stroke="#E6E8EB" stroke-width="1"/>
<rect x="128" y="826" width="134" height="5" rx="2.5" fill="#1A1A1A" opacity="0.35"/>
<rect x="16" y="104" width="358" height="96" rx="16" fill="#FFFFFF"/>
<text x="32" y="128" font-family="WenQuanYi Micro Hei, HarmonyOS Sans, sans-serif" font-size="12" font-weight="500" fill="#8A94A0" text-anchor="start">本机就绪</text>
<text x="32" y="156" font-family="WenQuanYi Micro Hei, HarmonyOS Sans, sans-serif" font-size="15" font-weight="600" fill="#E84026" text-anchor="start">不支持</text>
<text x="32" y="178" font-family="WenQuanYi Micro Hei, HarmonyOS Sans, sans-serif" font-size="11" font-weight="400" fill="#8A94A0" text-anchor="start">硬件</text>
<text x="118" y="156" font-family="WenQuanYi Micro Hei, HarmonyOS Sans, sans-serif" font-size="15" font-weight="600" fill="#5C6B7A" text-anchor="start">—</text>
<text x="118" y="178" font-family="WenQuanYi Micro Hei, HarmonyOS Sans, sans-serif" font-size="11" font-weight="400" fill="#8A94A0" text-anchor="start">开关</text>
<text x="204" y="156" font-family="WenQuanYi Micro Hei, HarmonyOS Sans, sans-serif" font-size="15" font-weight="600" fill="#5C6B7A" text-anchor="start">—</text>
<text x="204" y="178" font-family="WenQuanYi Micro Hei, HarmonyOS Sans, sans-serif" font-size="11" font-weight="400" fill="#8A94A0" text-anchor="start">权限</text>
<text x="290" y="156" font-family="WenQuanYi Micro Hei, HarmonyOS Sans, sans-serif" font-size="15" font-weight="600" fill="#2E7D32" text-anchor="start">真机</text>
<text x="290" y="178" font-family="WenQuanYi Micro Hei, HarmonyOS Sans, sans-serif" font-size="11" font-weight="400" fill="#8A94A0" text-anchor="start">环境</text>
<rect x="16" y="212" width="358" height="168" rx="16" fill="#FDECEA"/>
<text x="32" y="248" font-family="WenQuanYi Micro Hei, HarmonyOS Sans, sans-serif" font-size="18" font-weight="600" fill="#E84026" text-anchor="start">这台设备没有星闪硬件</text>
<text x="32" y="278" font-family="WenQuanYi Micro Hei, HarmonyOS Sans, sans-serif" font-size="13" font-weight="400" fill="#182431" text-anchor="start">isNearLinkSupported 为否。发现、服务、</text>
<text x="32" y="300" font-family="WenQuanYi Micro Hei, HarmonyOS Sans, sans-serif" font-size="13" font-weight="400" fill="#182431" text-anchor="start">端口都不再提供入口，避免进入空白扫描。</text>
<text x="32" y="330" font-family="WenQuanYi Micro Hei, HarmonyOS Sans, sans-serif" font-size="13" font-weight="400" fill="#5C6B7A" text-anchor="start">模拟器同样不可用。换一台支持星闪的真机。</text>
<text x="32" y="358" font-family="WenQuanYi Micro Hei, HarmonyOS Sans, sans-serif" font-size="12" font-weight="600" fill="#E84026" text-anchor="start">YW-NL-1001</text>
<rect x="16" y="396" width="358" height="118" rx="16" fill="#FFFFFF"/>
<rect x="16" y="396" width="4" height="118" rx="2" fill="#8A94A0"/>
